services:

  backend:
    build:
      context: ./backend
    container_name: sentinelai-backend
    ports:
      - "8000:8000"

  ai-engine:
    build:
      context: ./ai-engine
    container_name: sentinelai-ai
    ports:
      - "8001:8001"

  prometheus:
    image: prom/prometheus
    container_name: sentinelai-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: sentinelai-grafana

    ports:
      - "3000:3000"